name: Frontend CI

on:
  push:
    paths:
      - 'brewbase/frontend/**'
      - '.github/workflows/frontend.yml'

  pull_request:
    paths:
      - 'brewbase/frontend/**'
      - '.github/workflows/frontend.yml'

jobs:

  frontend:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: brewbase/frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build
